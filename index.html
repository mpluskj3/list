<!DOCTYPE html>
<html lang="ko">
<head>
    <script>
        (function() {
            const cachedFont = localStorage.getItem('fontViewer') || 'Pretendard';
            const fontCdnMap = {
                'Pretendard': "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css",
                'Noto Sans KR': "https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap",
                'Nanum Gothic': "https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap",
                'Nanum Myeongjo': "https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap",
                'Gowun Dodum': "https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap"
            };
            const fontFamilyMap = {
                'Pretendard': "'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif",
                'Noto Sans KR': "'Noto Sans KR', sans-serif",
                'Nanum Gothic': "'Nanum Gothic', sans-serif",
                'Nanum Myeongjo': "'Nanum Myeongjo', serif",
                'Gowun Dodum': "'Gowun Dodum', sans-serif"
            };
            if (fontCdnMap[cachedFont]) {
                const link = document.createElement('link');
                link.id = `font-link-${cachedFont.replace(/\s/g, '-')}`;
                link.rel = 'stylesheet';
                link.href = fontCdnMap[cachedFont];
                document.head.appendChild(link);
            }
            const style = document.createElement('style');
            style.textContent = `body { font-family: ${fontFamilyMap[cachedFont]} !important; }`;
            document.head.appendChild(style);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>집회 계획표</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="navigation-container" style="display: none;">
        <div id="sheet-navigation">
            <!-- JS에서 동적으로 생성됩니다 -->
        </div>
    </div>
    
    <button id="change-name-btn" class="name-change-btn floating" title="사용자 이름 변경">
        <i class="fas fa-user-edit"></i>
    </button>

    <div class="container" id="main-container">


        <div id="content"></div>
        <!-- 시트 인디케이터는 JS에서 자동 생성됩니다 -->
    </div>

    <!-- 페이지네이션 점 -->
    <div id="pagination-dots" class="pagination-dots"></div>

    <!-- 주간 선택 모달 -->
    <div id="week-select-modal" class="week-modal-overlay" style="display: none;">
        <div class="week-modal-content">
            <div class="week-modal-header">
                <span class="week-modal-title"><i class="fas fa-calendar-alt"></i> 주간 선택</span>
                <button id="close-week-modal-btn" class="week-modal-close-btn">&times;</button>
            </div>
            <div id="week-modal-list" class="week-modal-list">
                <!-- 주간 목록이 JS로 동적 생성됩니다 -->
            </div>
        </div>
    </div>
    
    <!-- 스크립트 로드 순서 중요 -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase_config.js"></script>
    <script src="utils.js"></script>
    <script src="app.js"></script>
</body>
</html>
